<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable — ytbmp3</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#06060a;color:#f0f0f5;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem}
        .code{font-family:'JetBrains Mono',monospace;font-size:6rem;font-weight:900;background:linear-gradient(135deg,hsl(330,90%,65%),hsl(270,80%,70%),hsl(210,90%,70%));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        h1{font-size:1.5rem;margin:.5rem 0;color:rgba(240,240,245,.55)}
        p{color:rgba(240,240,245,.3);margin:.5rem 0;font-size:.9rem}
        a{color:hsl(340,85%,60%);text-decoration:none;font-weight:600}
        a:hover{text-decoration:underline}
        .links{margin-top:2rem;display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
        .link{padding:.4rem .8rem;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:8px;font-size:.8rem;color:rgba(240,240,245,.55);transition:all .2s}
        .link:hover{border-color:rgba(255,255,255,.15);color:#f0f0f5;text-decoration:none}
    </style>
</head>
<body>
    <div>
        <div class="code">404</div>
        <h1>Page introuvable</h1>
        <p>Cette page n'existe pas. Essaie l'un de ces convertisseurs :</p>
        <div class="links">
            <a class="link" href="/">Accueil</a>
            {% for slug, data in platforms.items() %}
            <a class="link" href="/{{ slug }}">{{ data.platform_name }} MP3</a>
            {% endfor %}
        </div>
    </div>
</body>
</html>
